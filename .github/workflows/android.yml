name: Build MT-SLEEP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt-sleep-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MT-SLEEP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MT-SLEEP-APK
          path: MT-SLEEP.apk
      - name: Publish latest prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MT-SLEEP.apk --clobber
          else
            gh release create latest MT-SLEEP.apk --title "MT-SLEEP (development build)" --notes "Self-install APK. Debug signed by GitHub Actions. Before installing a later build, backup data; CI signature may change." --prerelease --latest=false
          fi
